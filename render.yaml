services:
  - type: web
    name: deadline-guardian
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python warmup.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemma-2-9b-it
      - key: HF_TOKEN
        sync: false
      - key: FASTEMBED_CACHE_DIR
        value: .cache/fastembed
